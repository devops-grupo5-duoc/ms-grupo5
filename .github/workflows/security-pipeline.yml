name: Security Pipeline (Snyk + SonarCloud)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # 1. Escaneo de vulnerabilidades con Snyk
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Install Snyk
        run: npm install -g snyk

      # Falla el pipeline si hay vulnerabilidades altas o criticas
      - name: Run Snyk (bloquea en high/critical)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=pom.xml --severity-threshold=high --json-file-output=snyk-report.json

      # always(): sube el reporte real aunque Snyk falle
      - name: Upload Snyk Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json
          if-no-files-found: warn

  # 2. Analisis SonarCloud (espera el Quality Gate)
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: snyk-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B verify -DskipTests \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=eduardo-fernandezc_ms-grupo5 \
            -Dsonar.organization=eduardo-fernandezc \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=true