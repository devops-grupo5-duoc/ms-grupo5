name: CD - Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  security:
    name: Seguridad
    uses: ./.github/workflows/security-pipeline.yml
    secrets: inherit

  test:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar pruebas
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Subir reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: target/surefire-reports
          if-no-files-found: warn

  publish-image:
    name: Publicar imagen Docker
    needs: [security, test]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Nombre de la imagen desplegable
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Desplegar en EC2
    needs: publish-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_IMAGE: ${{ needs.publish-image.outputs.image }}
          GIT_SHA: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_IMAGE,GIT_SHA,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            echo "🚀 Deploy iniciado - commit $GIT_SHA"

            PROYECTO="ms-grupo5"
            REPO_URL="https://github.com/devops-grupo5-duoc/ms-grupo5.git"

            if [ ! -d "$PROYECTO" ]; then
              git clone "$REPO_URL" "$PROYECTO"
            fi

            cd "$PROYECTO"

            if [ ! -f .env ]; then
              echo "❌ Falta el archivo .env en el servidor"
              exit 1
            fi

            git fetch origin
            git checkout -f main
            git reset --hard origin/main

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            export APP_IMAGE
            export GIT_SHA
            docker compose pull ms-pedido
            docker compose up -d --remove-orphans

            docker logout ghcr.io
            docker image prune -f

            echo "$GIT_SHA" > .deployed_sha
            docker compose ps
            echo "✅ Deploy terminado"

  smoke-test:
    name: Prueba de humo
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Esperar a que la API esté saludable
        run: |
          for i in $(seq 1 24); do
            if curl -fsS http://${{ secrets.EC2_HOST }}:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "API saludable"
              exit 0
            fi
            echo "Esperando API... intento $i"
            sleep 10
          done
          echo "La API no respondió a tiempo"
          exit 1

      - name: Probar endpoint de pedidos
        run: curl -fsS http://${{ secrets.EC2_HOST }}:8080/api/v1/pedidos

      - name: Probar endpoint de pedidos
        run: curl -fsS http://${{ secrets.EC2_HOST }}:8080/api/v1/pedidos

      - name: Verificar que corre el commit desplegado
        run: |
          curl -fsS http://${{ secrets.EC2_HOST }}:8080/api/v1/info | grep -q "${{ github.sha }}"
      - name: Verificar que corre el commit desplegado
        run: |
          curl -fsS http://${{ secrets.EC2_HOST }}:8080/api/v1/info | grep -q "${{ github.sha }}"